name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# مجوزهای مورد نیاز برای ساخت Release
permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (using pre-installed)
        run: |
          # Ubuntu GitHub runner has Android SDK pre-installed
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME
          # Accept all SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Verify platform 34 and build-tools are installed
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null || \
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | head -30
          # Install necessary components
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List built APKs
        run: |
          echo "=== Debug APK ==="
          find . -name "*.apk" -path "*/debug/*" -exec ls -lh {} \;
          echo "=== Release APK ==="
          find . -name "*.apk" -path "*/release/*" -exec ls -lh {} \;

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moghayerat-gir-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moghayerat-gir-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            # مغایرت‌گیر دامداران - نسخه ${{ github.ref_name }}

            ## دانلود APK
            - **موبایل گوشی (Universal)**: فایل `moghayerat-gir-debug-*.apk` یا `moghayerat-gir-release-*.apk`

            ## نصب
            1. فایل APK را روی گوشی اندرویدی (نسخه ۸.۰ به بالا) کپی کنید
            2. در تنظیمات گوشی، "نصب از منابع ناشناخته" را فعال کنید
            3. روی فایل APK کلیک کنید و Install را بزنید

            ## اطلاعات نسخه
            - Kotlin + Jetpack Compose + Material 3
            - معماری MVVM با Room database
            - کاملاً آفلاین - بدون نیاز به اینترنت
            - راست‌چین فارسی با فونت پیش‌فرض سیستم
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
